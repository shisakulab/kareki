<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cyberjapandata.gsi.go.jp; connect-src 'self'; worker-src 'self'; manifest-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5efe0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="菓暦">
<title>菓暦</title>
<meta name="description" content="和菓子の図鑑。どら焼き・大福・季節の和菓子を記録して、和菓子屋をめぐって判子を集める、無料・登録不要のスマホ向け Web アプリ">
<meta property="og:type" content="website">
<meta property="og:site_name" content="菓暦">
<meta property="og:title" content="菓暦（かれき）｜和菓子の図鑑">
<meta property="og:description" content="どら焼き・大福などの定番と、毎月の季節の和菓子を記録して、和菓子の図鑑を埋める。近くの和菓子屋に立ち寄って判子を集めるスマホ向け Web アプリ（無料・登録不要）">
<meta property="og:url" content="https://shisakulab.github.io/kareki/">
<meta property="og:image" content="https://shisakulab.github.io/kareki/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="style.css">
<script src="vendor/leaflet.js"></script>
</head>
<body>
<main id="view" class="view"><div id="map"></div></main>
<div class="hud">
  <button id="quest" class="quest" type="button"></button>
  <div id="near" class="near" hidden></div>
  <div class="mapnote">長押しで店を追加</div>
</div>
<nav id="fab" class="fab" aria-label="メニュー">
  <button type="button" class="rbtn" data-open="zukan">図鑑</button>
  <button type="button" class="rbtn main" data-open="record" aria-label="記録する">＋</button>
  <button type="button" class="rbtn" data-open="diary">日記</button>
</nav>
<button id="search" class="locate search" type="button" aria-label="店を探す"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15 15l6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
<button id="locate" class="locate on" type="button" aria-label="現在地に移動"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="currentColor"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
<div id="scrim" class="scrim" hidden></div>
<section id="sheet" class="sheet" hidden aria-label="パネル">
  <div id="grab" class="grab" aria-label="下に引くと閉じる"><span></span></div>
  <div id="sheetbody" class="sheetbody"></div>
</section>
<div id="toast" class="toast" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
